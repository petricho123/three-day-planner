<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>작심삼일</title><link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="app.js" defer></script></head>
<body><div class="shell"><header><div class="brand"><div><p class="eyebrow">THREE DAYS, AGAIN.</p><h1>작심삼일</h1></div><button id="menu-button" aria-label="메뉴" aria-expanded="false">⋮</button></div><div id="menu" hidden><button id="today-button">오늘 회차로</button><button id="history-button">리셋 이전 기록</button><button id="reset-button" class="danger">오늘부터 리셋</button></div><div class="cycle-nav"><button id="previous" aria-label="이전 회차">‹</button><div><h2 id="cycle-title"></h2><p id="cycle-date"></p></div><button id="next" aria-label="다음 회차">›</button></div></header><main id="planner"></main><p class="hint" id="context"></p><div id="toast" role="status" aria-live="polite"></div></div>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><label id="field-label" for="editor-input">내용</label><input id="editor-input" maxlength="200" autocomplete="off" required><div class="dialog-actions"><button type="button" id="cancel-editor">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>
<dialog id="confirm"><h2>오늘부터 다시 시작할까요?</h2><p>현재 진행 중인 계획을 비우고 오늘부터 새로운 3일을 시작합니다. 기존 회차와 미리 작성한 계획은 ‘리셋 이전 기록’에 보관됩니다.</p><div class="dialog-actions"><button id="cancel-reset">취소</button><button id="confirm-reset" class="primary">리셋</button></div></dialog>
<dialog id="history"><h2>리셋 이전 기록</h2><div id="history-list"></div><div class="dialog-actions"><button id="close-history">닫기</button></div></dialog>
<dialog id="start"><form id="start-form"><p class="eyebrow">작심삼일의 시작</p><h2>첫날을 골라주세요</h2><p>선택한 날부터 3일씩 계획이 이어집니다.</p><label for="start-date">시작일</label><input id="start-date" type="date" required><button type="submit" class="primary full">시작하기</button></form></dialog>
</body></html>
